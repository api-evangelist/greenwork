name: Greenwork
description: 'Greenwork builds software for the HVAC (heating, ventilation, and air
  conditioning) industry and is backed by GV (Google Ventures). Its flagship product,
  Onsite Pro, is a digital pricebook and proposal platform for HVAC distributors and
  their dealers: it replaces Excel and PDF catalogs with searchable product data,
  automated AHRI equipment matchups, incentive and rebate application, and one-click
  proposal generation, while giving distributors visibility into dealer catalog performance,
  win rates, and share of wallet. Greenwork does not currently publish a public developer
  API, SDKs, or API documentation; this profile captures the company identity and
  its public web and security posture for the API Evangelist network.'
